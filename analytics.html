<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analytics - AutoNiche Network</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="style.css">
<style>
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin:1.5rem 0}
.dash-card{background:var(--card);border:1px solid #1f2733;border-radius:12px;padding:1.2rem;text-align:center}
.dash-card h3{margin:0;font-size:1rem;color:var(--muted)}
.dash-card .num{font-size:2.4rem;font-weight:700;color:var(--accent);margin:.3rem 0}
table{width:100%;border-collapse:collapse;margin:1rem 0;font-size:.9rem}
th{text-align:left;padding:.5rem;border-bottom:1px solid #1f2733;color:var(--muted)}
td{padding:.5rem;border-bottom:1px solid #141925}
.bar{display:inline-block;height:6px;border-radius:3px;background:var(--accent);margin-right:.5rem;vertical-align:middle}
</style>

</head><body>
<header class="site-header"><div class="wrap"><a href="index.html" class="back">&larr; AutoNiche Network</a><h1>Analytics</h1></div></header>
<main class="wrap"><div id="analytics-root"></div></main>
<script>
var NS = "shadow4stories-arch.autonich";
function render(){var d=JSON.parse(localStorage.getItem("_avisits")||"[]");var pages={},refs={};d.forEach(function(h){pages[h.p]=(pages[h.p]||0)+1;if(h.r)refs[h.r]=(refs[h.r]||0)+1});var uvs=new Set(d.map(function(h){return localStorage.getItem("_auid")||"?"}));var last24=d.filter(function(h){return h.t>Date.now()-86400000}).length;var h='<div class=dash-grid><div class=dash-card><h3>Visitas (nube)</h3><div class=num id=pv-count>...</div></div><div class=dash-card><h3>Visitas (local)</h3><div class=num>'+d.length+'</div></div><div class=dash-card><h3>Visitantes unicos</h3><div class=num>'+uvs.size+'</div></div><div class=dash-card><h3>Ultimas 24h</h3><div class=num>'+last24+'</div></div></div>';
h+='<h2>Paginas visitadas</h2><table><thead><tr><th>Pagina</th><th>Veces</th></tr></thead><tbody>';
var max=1;var pe=Object.entries(pages);pe.forEach(function(e){if(e[1]>max)max=e[1]});
pe.forEach(function(e){var w=Math.round(e[1]/max*100);h+='<tr><td>'+e[0]+'</td><td>'+e[1]+'</td><td><div class=bar style="width:'+w+'%"></div></td></tr>'});
h+='</tbody></table><h2>Referentes</h2><table><thead><tr><th>Referente</th><th>Veces</th></tr></thead><tbody>';
var re=Object.entries(refs);if(re.length){re.forEach(function(e){h+='<tr><td>'+e[0]+'</td><td>'+e[1]+'</td></tr>'})}else{h+='<tr><td colspan=2 style="color:var(--muted)">Ninguno</td></tr>'}
h+='</tbody></table>';document.getElementById("analytics-root").innerHTML=h}
render();
fetch("https://api.countapi.xyz/get/"+NS+"/pv").then(function(r){return r.json()}).then(function(d){document.getElementById("pv-count").textContent=d.value||0}).catch(function(){document.getElementById("pv-count").textContent="?"});
</script>
</body></html>
